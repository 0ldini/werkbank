# Programmliste der Werkbank.
# Der Launcher lädt diese Datei beim Start aus dem Repository; neue Einträge erscheinen
# deshalb ohne neuen Launcher. Jede App kommt aus den Releases von "repo".
#
#   id        Programmdatei und Anfang der Release-Dateinamen (wie im Original)
#   name      Anzeigename
#   tag       Anfang der Release-Tags dieser App, z. B. "pdfcraft-v" → pdfcraft-v0.7.1
#   pin       (optional) auf dieser Version bleiben, z. B. pin = "0.7.1"
#   types     Dateitypen, die das Programm öffnen kann (Einstellungen → Dateitypen)
#   no_web    (optional) true: keine Browser-Version
#   about_en  (optional) Beschreibung auf Englisch
#   web_only  (optional) true für eigene HTML5-Apps: nur Browser-Version,
#             Release-Datei <id>-web-<version>.zip

title = "Werkbank"

[[app]]
id = "photocraft"
name = "Bildwerk"
about = "Bildbearbeitung mit Ebenen und Masken"
about_en = "Image editing with layers and masks"
color = "#2F6FDE"
repo = "https://github.com/0ldini/werkbank"
tag = "photocraft-v"
types = [".psd", ".png", ".jpg", ".jpeg", ".webp", ".tif", ".tiff", ".gif", ".bmp"]

