[package]
name = "ftpwerk"
version = "0.1.0"
edition = "2021"
description = "FTPwerk – FTP-, FTPS- und SFTP-Client (Teil der Werkbank-Suite)"
authors = ["Oli"]

# Nur nativ (Windows, Linux): ein Browser darf keine rohen FTP-/SSH-Verbindungen öffnen.

[features]
default = ["tls", "sftp"]
tls = ["dep:rustls", "dep:webpki-roots", "dep:sha2"]
sftp = ["dep:russh", "dep:russh-sftp", "dep:tokio", "dep:sha2"]

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.14"
# FTPS: wie in Mailwerk (rustls mit ring), dazu die eigene Zertifikatsprüfung.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
sha2 = { version = "0.10", optional = true }
# SFTP: reines Rust, kein OpenSSL und keine C-Bibliothek nötig.
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"], optional = true }
russh-sftp = { version = "3", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util"], optional = true }

[profile.release]
opt-level = 3
lto = true
strip = true
