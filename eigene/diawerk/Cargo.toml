[package]
name = "diawerk"
version = "0.3.0"
edition = "2021"
description = "Diashows aus Fotos und Drohnenvideos – Teil der Werkbank"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
strip = true
