[package]
name = "umbenennwerk"
version = "0.4.2"
edition = "2021"
description = "Umbenennwerk – Dateien stapelweise umbenennen (Teil der Werkbank-Suite)"
authors = ["Oli"]

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.14"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2

# Ausweichweg, wenn OpenGL fehlt (siehe stil::starten): nur in der Desktop-Ausgabe.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.eframe]
version = "0.29"
default-features = false
features = ["wgpu"]
