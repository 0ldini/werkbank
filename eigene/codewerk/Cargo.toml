[package]
name = "codewerk"
version = "0.5.4"
edition = "2021"
description = "Codewerk – QR-Codes erstellen (Teil der Werkbank-Suite)"
authors = ["Oli"]

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Ausweichweg, wenn OpenGL fehlt (siehe stil::starten).
eframe = { version = "0.29", default-features = false, features = ["wgpu"] }
rfd = "0.14"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlCanvasElement", "Element", "Document", "Window", "HtmlElement"] }
js-sys = "0.3"


[target.'cfg(windows)'.dependencies]
# DirectX 12 für den wgpu-Ausweichweg (eframe bringt unter Windows sonst nur Vulkan mit;
# ohne Grafiktreiber läuft DirectX 12 in Software).
wgpu = { version = "22", default-features = false, features = ["dx12"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
