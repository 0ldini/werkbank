[package]
name = "codewerk"
version = "0.3.0"
edition = "2021"
description = "Codewerk – QR-Codes erstellen (Teil der Werkbank-Suite)"
authors = ["Oli"]

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.14"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlCanvasElement", "Element", "Document", "Window", "HtmlElement"] }
js-sys = "0.3"

[profile.release]
opt-level = 2
