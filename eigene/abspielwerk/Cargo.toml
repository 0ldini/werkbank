[package]
name = "abspielwerk"
version = "0.1.0"
edition = "2021"
description = "Videos, Musik und Bilder ansehen – Teil der Werkbank"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
rfd = "0.14"
# libVLC wird zur Laufzeit geladen (keine Abhängigkeit beim Linken).
libloading = "0.8"
# Bildbetrachter: gleiche Version wie in egui/eframe.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
# Drehung aus der Kamera (EXIF-Orientierung).
kamadak-exif = "0.6"
# «In Papierkorb»
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true

[package.metadata.werkbank]
# Keine Browser-Version (keine index.html): libVLC gibt es nur auf dem Desktop.
