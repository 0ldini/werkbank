[package]
name = "mailwerk"
version = "0.1.0"
edition = "2021"
description = "Mailwerk – E-Mail-Programm (Teil der Werkbank-Suite)"
authors = ["Oli"]

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
# HTTP für JMAP: im Browser über fetch, auf dem Desktop über ureq.
ehttp = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlCanvasElement", "Element", "Document", "Window", "HtmlElement"] }
js-sys = "0.3"

[profile.release]
opt-level = 2
