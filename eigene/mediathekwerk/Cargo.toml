[package]
name = "mediathekwerk"
version = "1.3.0"
edition = "2021"
description = "Filme & Serien (TMDB) – Teil der Werkbank"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui_extras = { version = "0.29", features = ["all_loaders"] }
ureq = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
