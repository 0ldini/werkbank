[package]
name = "ladewerk"
version = "0.1.0"
edition = "2021"
description = "Download-Manager – Teil der Werkbank"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
rfd = "0.14"
# HTTP wie im Launcher: ureq 3 mit rustls und den Zertifikaten des Systems (kein gzip,
# damit Bytebereiche beim Fortsetzen stimmen). Proxy kommt aus der Umgebung.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "socks-proxy"] }
sha2 = "0.10"
# ZIP selbst entpacken, auch mit Passwort (ZipCrypto und AES).
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "aes-crypto"] }
# Zwischenablage lesen (nur Text).
arboard = { version = "3", default-features = false }

[profile.release]
opt-level = 3
lto = true
strip = true
