[package]
name = "ladewerk"
version = "1.1.0"
edition = "2021"
description = "Download-Manager im JDownloader-Stil – Teil der Werkbank"

[dependencies]
ed25519-dalek = "2.1"
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
strip = true
