[package]
name = "ladewerk"
version = "1.1.2"
edition = "2021"
description = "Download-Manager im JDownloader-Stil – Teil der Werkbank"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
rfd = "0.14"


[target.'cfg(windows)'.dependencies]
# DirectX 12 für den wgpu-Ausweichweg (eframe bringt unter Windows sonst nur Vulkan mit;
# ohne Grafiktreiber läuft DirectX 12 in Software).
wgpu = { version = "22", default-features = false, features = ["dx12"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true

# Ausweichweg, wenn OpenGL fehlt (siehe stil::starten): nur in der Desktop-Ausgabe.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.eframe]
version = "0.29"
default-features = false
features = ["wgpu"]
