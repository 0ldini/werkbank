<!doctype html>
<html lang="de" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ladewerk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1f28'/%3E%3Cpath d='M32 12v26M20 28l12 12 12-12' fill='none' stroke='%23f5a524' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='14' y='46' width='36' height='7' rx='3.5' fill='%23f5a524'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#12151b;--panel:#1a1f28;--panel2:#212734;--line:#2c3443;--txt:#e6e9ef;--dim:#8d97a8;--acc:#f5a524;--ok:#3ecf8e;--bad:#f2555a;--info:#5aa9f7}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:18px;letter-spacing:.3px}.logo b{color:var(--acc)}
.sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#46526a}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1b1300;font-weight:700}
.btn.sm{padding:3px 8px;border-radius:6px;min-width:30px}
.btn.on{background:#173626;border-color:#235a3d;color:var(--ok);font-weight:700}
.btn.off{background:#3a2a12;border-color:#6a4a16;color:var(--acc);font-weight:700}
.gspeed{font-variant-numeric:tabular-nums;color:var(--dim);min-width:110px;text-align:right}
nav{display:flex;gap:4px;padding:10px 18px 0;background:var(--panel)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;color:var(--dim);font-weight:600}
nav button.act{color:var(--txt);border-color:var(--acc)}
nav .cnt{background:var(--panel2);border-radius:10px;padding:1px 8px;margin-left:6px;font-size:12px}
main{flex:1;overflow:auto;padding:16px 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
textarea{width:100%;min-height:96px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.line input[type=text]{width:240px}
.hint{color:var(--dim);font-size:12.5px}
.pkg{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px 10px 0 0;font-weight:700;margin-top:12px}
.pkg small{font-weight:400;color:var(--dim)}
.rows{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;overflow:hidden}
.row{display:grid;grid-template-columns:26px minmax(180px,1fr) 150px 90px 70px 120px 112px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.row:first-child{border-top:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .u{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c{font-variant-numeric:tabular-nums;color:var(--dim);text-align:right;white-space:nowrap;font-size:13px}
.bar{height:5px;background:var(--bg);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--info);border-radius:3px;transition:width .4s}
.s-done .bar i{background:var(--ok)}.s-error .bar i,.s-offline .bar i{background:var(--bad)}.s-paused .bar i{background:var(--dim)}
.stt{text-align:left;color:var(--txt)}.s-done .stt,.s-ready .stt{color:var(--ok)}.s-error .stt,.s-offline .stt{color:var(--bad)}.s-running .stt{color:var(--info)}
.acts{display:flex;gap:5px;justify-content:flex-end}
.empty{text-align:center;color:var(--dim);padding:46px 10px}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 12px;font-size:17px}
dialog label{display:block;margin:10px 0 4px;color:var(--dim);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:9px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
@media(max-width:820px){.row{grid-template-columns:26px 1fr 96px}.row .c.x{display:none}.row .stt{display:none}}
dialog{max-height:90vh;overflow:auto}
dialog h3{margin:20px 0 2px;font-size:14px;color:var(--acc);border-top:1px solid var(--line);padding-top:14px}
dialog textarea{min-height:64px}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0 0;color:var(--txt);font-size:14px}
.acc{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;margin-top:8px}
.acc .t{flex:1;min-width:0}.acc small{display:block;color:var(--dim)}.acc small.ok{color:var(--ok)}.acc small.bad{color:var(--bad)}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:inherit;font:inherit;width:100%}
@media(prefers-reduced-motion:reduce){.bar i,#toast{transition:none}}
</style></head><body>
<header>
  <div class="logo">Lade<b>werk</b></div>
  <button class="btn" id="toggle"></button>
  <div class="sp"></div>
  <div class="gspeed" id="gspeed"></div>
  <button class="btn" id="openDir">Ordner öffnen</button>
  <button class="btn" id="openSet">Einstellungen</button>
</header>
<nav>
  <button data-tab="grab">Linksammler<span class="cnt" id="cGrab">0</span></button>
  <button data-tab="dl">Downloads<span class="cnt" id="cDl">0</span></button>
</nav>
<main>
  <section id="tGrab">
    <div class="card">
      <textarea id="links" placeholder="Links hier einfügen – beliebiger Text, die Adressen werden automatisch herausgesucht."></textarea>
      <div class="line">
        <input type="text" id="pkg" placeholder="Paketname (optional, wird Unterordner)">
        <button class="btn pri" id="bGrab">Links prüfen</button>
        <button class="btn" id="bScan" title="Lädt die angegebenen Seiten und sammelt alle darin verlinkten Dateien">Seiten nach Dateien durchsuchen</button>
      </div>
    </div>
    <div class="line" id="grabBar" style="margin:0 0 4px">
      <button class="btn pri" data-bulk="confirm">Auswahl herunterladen</button>
      <button class="btn" data-bulk="remove-grab">Auswahl entfernen</button>
      <button class="btn" id="clrOff">Nicht erreichbare entfernen</button>
      <span class="hint" id="grabInfo"></span>
    </div>
    <div id="grabList"></div>
  </section>
  <section id="tDl" hidden>
    <div class="line" style="margin:0 0 4px">
      <button class="btn" data-bulk="pause">Auswahl pausieren</button>
      <button class="btn" data-bulk="resume">Auswahl fortsetzen</button>
      <button class="btn" data-bulk="remove-dl">Auswahl entfernen</button>
      <button class="btn" id="clrDone">Fertige ausblenden</button>
      <span class="hint" id="dlInfo"></span>
    </div>
    <div id="dlList"></div>
  </section>
</main>
<dialog id="dlg">
  <h2>Einstellungen</h2>
  <label for="sDir">Download-Ordner</label><input type="text" id="sDir">
  <div class="grid2">
    <div><label for="sPar">Gleichzeitige Downloads (1–10)</label><input type="number" id="sPar" min="1" max="10"></div>
    <div><label for="sChk">Verbindungen pro Datei (1–8)</label><input type="number" id="sChk" min="1" max="8"></div>
    <div><label for="sLim">Tempolimit in KB/s (0 = aus)</label><input type="number" id="sLim" min="0"></div>
    <div><label for="sRet">Wiederholungen bei Fehler</label><input type="number" id="sRet" min="0" max="10"></div>
  </div>
  <label class="chk"><input type="checkbox" id="sCnl"> Click'n'Load annehmen (Links von Webseiten mit Click'n'Load-Knopf landen im Linksammler)</label>
  <div class="hint" id="sCnlInfo" style="margin-left:26px"></div>
  <label class="chk"><input type="checkbox" id="sClip"> Zwischenablage beobachten (kopierte Datei- und Hoster-Links landen im Linksammler)</label>

  <h3>Entpacken</h3>
  <label class="chk"><input type="checkbox" id="sExt"> Archive nach dem Download automatisch entpacken</label>
  <label class="chk"><input type="checkbox" id="sDel"> Archivdateien nach erfolgreichem Entpacken löschen</label>
  <label for="sPw">Passwörter für Archive (eines pro Zeile, werden der Reihe nach probiert)</label>
  <textarea id="sPw" spellcheck="false"></textarea>
  <div class="hint" id="sTool"></div>

  <h3>Konten</h3>
  <div id="accList"></div>
  <div class="grid2">
    <div><label for="aHost">Hoster</label><select id="aHost"></select></div>
    <div><label for="aUser">Benutzername / E-Mail</label><input type="text" id="aUser" autocomplete="off"></div>
    <div><label for="aPw">Passwort</label><input type="password" id="aPw" autocomplete="new-password" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%"></div>
    <div style="display:flex;align-items:flex-end"><button class="btn" id="aSave" style="width:100%">Konto speichern und prüfen</button></div>
  </div>
  <div class="hint" style="margin-top:6px">Das Passwort wird verschlüsselt auf diesem Computer abgelegt und nur an den Hoster gesendet.</div>

  <div class="line" style="margin-top:18px">
    <button class="btn" id="sQuit" title="Downloads anhalten und Ladewerk beenden">Ladewerk beenden</button>
    <div class="sp"></div>
    <button class="btn" id="sCancel">Schliessen</button><button class="btn pri" id="sSave">Speichern</button>
  </div>
</dialog>
<div id="toast" role="status"></div>
<script>
(function(){
var st=null, tab=null, sel={}, lastG='', lastD='', lastA='', busy=false;
var LBL={checking:'Prüfe…',ready:'Bereit',offline:'Nicht erreichbar',queued:'Wartet',running:'Lädt',paused:'Pausiert',done:'Fertig',error:'Fehler'};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function size(n){if(n==null)return '–';var u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<4){n/=1024;i++}return (i?n.toFixed(n<10?2:1):n)+' '+u[i]}
function eta(s){if(!isFinite(s)||s<0)return '';s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+' h '+m+' min':m?m+' min '+x+' s':x+' s'}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},3500)}
function api(p,b){return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})
  .then(function(r){return r.json()}).then(function(j){if(j.error)toast(j.error);refresh();return j})
  .catch(function(){toast('Ladewerk läuft nicht mehr – bitte neu starten.');return {error:1}})}
function refresh(){return fetch('/api/state').then(function(r){return r.json()}).then(function(j){st=j;render()}).catch(function(){$('gspeed').textContent='keine Verbindung'})}
function setTab(t){tab=t;$('tGrab').hidden=t!=='grab';$('tDl').hidden=t!=='dl';
  var b=document.querySelectorAll('nav button');for(var i=0;i<b.length;i++)b[i].classList.toggle('act',b[i].getAttribute('data-tab')===t)}
function pct(it){return it.status==='done'?100:(it.size?Math.min(100,it.done/it.size*100):0)}
function rowHtml(it,grab){
  var p=pct(it), a='';
  if(grab){
    if(it.status==='ready')a+='<button class="btn sm" title="Herunterladen" data-act="confirm" data-id="'+it.id+'">⬇</button>';
    if(it.status==='offline')a+='<button class="btn sm" title="Erneut prüfen" data-act="recheck" data-id="'+it.id+'">↻</button>';
  }else{
    if(it.status==='running'||it.status==='queued')a+='<button class="btn sm" title="Pausieren" data-act="pause" data-id="'+it.id+'">⏸</button>';
    if(it.status==='paused')a+='<button class="btn sm" title="Fortsetzen" data-act="resume" data-id="'+it.id+'">▶</button>';
    if(it.status==='error')a+='<button class="btn sm" title="Erneut versuchen" data-act="resume" data-id="'+it.id+'">↻</button>';
    if(it.status==='done'&&it.archive&&it.extract!=='wait'&&it.extract!=='running')a+='<button class="btn sm" title="Entpacken" data-act="extract" data-id="'+it.id+'">📦</button>';
  }
  a+='<button class="btn sm" title="Entfernen" data-act="remove" data-id="'+it.id+'">✕</button>';
  var sz=grab?size(it.size):(it.status==='done'?size(it.size):size(it.done)+' / '+size(it.size));
  var sp=it.status==='running'?size(it.speed)+'/s':'';
  var et=it.status==='running'&&it.size&&it.speed>0?eta((it.size-it.done)/it.speed):'';
  var lbl=LBL[it.status]||it.status;
  if(it.status==='running'&&it.conns>1)lbl+=' ('+it.conns+'×)';
  if(it.status==='running'&&it.size)lbl=Math.floor(p)+' % · '+lbl;
  var cls=it.status, err=it.error;
  if(!grab&&it.status==='done'){
    if(it.extract==='wait')lbl='Fertig · entpacken folgt';
    if(it.extract==='running'){lbl='Entpacke…';cls='running'}
    if(it.extract==='ok')lbl='Fertig · entpackt';
    if(it.extract==='error'){lbl='Entpacken fehlgeschlagen';cls='error';err=it.extractMsg}
  }
  var sub=err?'<div class="u" style="color:var(--bad)">'+esc(err)+'</div>':(grab?'<div class="u">'+esc(it.url)+'</div>':'<div class="bar"><i style="width:'+p.toFixed(1)+'%"></i></div>');
  return '<div class="row s-'+cls+'"><input type="checkbox" aria-label="Auswählen" data-sel="'+it.id+'"'+(sel[it.id]?' checked':'')+'>'
    +'<div style="min-width:0"><div class="t" title="'+esc(it.url)+'">'+esc(it.name)+'</div>'+sub+'</div>'
    +'<div class="c">'+sz+'</div><div class="c x">'+sp+'</div><div class="c x">'+et+'</div><div class="c stt">'+esc(lbl)+'</div><div class="acts">'+a+'</div></div>';
}
function listHtml(items,grab,emptyMsg){
  if(!items.length)return '<div class="empty">'+emptyMsg+'</div>';
  var order=[],g={};
  items.forEach(function(it){if(!g[it.pkg]){g[it.pkg]=[];order.push(it.pkg)}g[it.pkg].push(it)});
  return order.map(function(k){
    var l=g[k],tot=0,dn=0,unk=false;
    l.forEach(function(i){if(i.size==null)unk=true;else tot+=i.size;dn+=i.done});
    var info=l.length+(l.length===1?' Datei':' Dateien')+' · '+(grab?size(tot):size(dn)+' / '+size(tot))+(unk?' +?':'');
    return '<div class="pkg"><input type="checkbox" aria-label="Paket auswählen" data-selpkg="'+esc(k)+'" data-grab="'+(grab?1:0)+'"><span>'+esc(k||'Ohne Paket')+'</span><small>'+info+'</small></div><div class="rows">'
      +l.map(function(i){return rowHtml(i,grab)}).join('')+'</div>';
  }).join('');
}
function render(){
  if(!st)return;
  var gi=st.items.filter(function(i){return i.stage==='grab'}), di=st.items.filter(function(i){return i.stage==='queue'});
  if(tab===null)setTab(di.length&&!gi.length?'dl':'grab');
  $('cGrab').textContent=gi.length;$('cDl').textContent=di.length;
  var t=$('toggle');t.textContent=st.active?'● Läuft – Stopp':'■ Angehalten – Start';t.className='btn '+(st.active?'on':'off');
  $('gspeed').textContent=st.speed?size(st.speed)+'/s':'';
  document.title=(st.speed?size(st.speed)+'/s – ':'')+'Ladewerk';
  var ids={};st.items.forEach(function(i){ids[i.id]=1});Object.keys(sel).forEach(function(k){if(!ids[k])delete sel[k]});
  var h=listHtml(gi,true,'Noch keine Links im Sammler. Oben einfügen und «Links prüfen» drücken.');
  if(h!==lastG){$('grabList').innerHTML=h;lastG=h}
  h=listHtml(di,false,'Keine Downloads in der Liste.');
  if(h!==lastD){$('dlList').innerHTML=h;lastD=h}
  var rdy=gi.filter(function(i){return i.status==='ready'}).length;
  $('grabInfo').textContent=gi.length?rdy+' von '+gi.length+' bereit':'';
  var dn=di.filter(function(i){return i.status==='done'}).length;
  var ah=st.accounts.map(function(a){return '<div class="acc"><div class="t"><b>'+esc(a.host)+'</b> · '+esc(a.user)+'<small class="'+(a.ok===true?'ok':a.ok===false?'bad':'')+'">'+esc(a.info||(a.ok===null?'Noch nicht geprüft':''))+'</small></div><button class="btn sm" data-acc="check" data-host="'+esc(a.host)+'">Prüfen</button><button class="btn sm" title="Konto entfernen" data-acc="remove" data-host="'+esc(a.host)+'">✕</button></div>'}).join('')||'<div class="hint">Noch kein Konto eingetragen.</div>';
  if(ah!==lastA){$('accList').innerHTML=ah;lastA=ah}
  $('sCnlInfo').textContent=st.settings.clicknload?'Status: '+(st.cnl||'startet…'):'';
  $('sTool').textContent=st.extractor?'Entpacker: '+st.extractor:'Kein Entpacker gefunden – bitte 7-Zip installieren (7-zip.org).';
  busy=st.items.some(function(i){return i.status==='running'});
  $('dlInfo').textContent=di.length?dn+' von '+di.length+' fertig':'';
}
function selected(stage){return st.items.filter(function(i){return i.stage===stage&&sel[i.id]}).map(function(i){return i.id})}
function grabGo(scan){
  var v=$('links').value;if(!v.trim()){toast('Bitte zuerst Links einfügen.');return}
  var b=scan?$('bScan'):$('bGrab');b.disabled=true;
  api('/api/grab',{text:v,pkg:$('pkg').value,scan:scan}).then(function(j){
    b.disabled=false;if(j.error)return;
    if(!j.found){toast(scan?'Keine Datei-Links auf den Seiten gefunden.':'Keine Links im Text gefunden.');return}
    $('links').value='';
    toast(j.added+' neu im Sammler'+(j.duplicates?', '+j.duplicates+' schon vorhanden':'')+(j.notes&&j.notes.length?' · '+j.notes.length+' Seite(n) nicht lesbar':''));
  });
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-tab],[data-act],[data-bulk],[data-acc]');if(!el)return;
  if(el.hasAttribute('data-acc')){api(el.getAttribute('data-acc')==='check'?'/api/accountCheck':'/api/accountRemove',{host:el.getAttribute('data-host')});return}
  if(el.hasAttribute('data-tab'))return setTab(el.getAttribute('data-tab'));
  if(el.hasAttribute('data-act')){
    var act=el.getAttribute('data-act');
    api('/api/action',{action:act,ids:[el.getAttribute('data-id')]}).then(function(){if(act==='confirm')toast('Zu den Downloads hinzugefügt.');if(act==='extract')toast('Wird entpackt, sobald alle Teile fertig sind.')});
    return;
  }
  var b=el.getAttribute('data-bulk'), stage=(b==='confirm'||b==='remove-grab')?'grab':'queue', ids=selected(stage);
  if(b==='confirm'&&!ids.length)ids=st.items.filter(function(i){return i.stage==='grab'&&i.status==='ready'}).map(function(i){return i.id});
  if(!ids.length){toast('Nichts ausgewählt.');return}
  var action=b.indexOf('remove')===0?'remove':b;
  api('/api/action',{action:action,ids:ids}).then(function(){if(b==='confirm'){setTab('dl')}});
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.hasAttribute('data-sel')){if(t.checked)sel[t.getAttribute('data-sel')]=1;else delete sel[t.getAttribute('data-sel')]}
  if(t.hasAttribute('data-selpkg')){
    var k=t.getAttribute('data-selpkg'),stage=t.getAttribute('data-grab')==='1'?'grab':'queue';
    st.items.forEach(function(i){if(i.stage===stage&&i.pkg===k){if(t.checked)sel[i.id]=1;else delete sel[i.id]}});
    lastG=lastD='';render();
    var again=document.querySelectorAll('[data-selpkg]');for(var n=0;n<again.length;n++)if(again[n].getAttribute('data-selpkg')===k&&again[n].getAttribute('data-grab')===t.getAttribute('data-grab'))again[n].checked=t.checked;
  }
});
$('bGrab').onclick=function(){grabGo(false)};
$('bScan').onclick=function(){grabGo(true)};
$('toggle').onclick=function(){api('/api/control',{active:!st.active})};
$('openDir').onclick=function(){api('/api/openFolder')};
$('clrDone').onclick=function(){api('/api/clear',{what:'done'})};
$('clrOff').onclick=function(){api('/api/clear',{what:'offline'})};
$('openSet').onclick=function(){var s=st.settings;$('sDir').value=s.dir;$('sPar').value=s.maxParallel;$('sChk').value=s.chunks;$('sLim').value=s.speedLimitKB;$('sRet').value=s.retries;
  $('sClip').checked=s.clipboard;$('sCnl').checked=s.clicknload;$('sExt').checked=s.extract;$('sDel').checked=s.deleteArchives;$('sPw').value=s.passwords.join('\n');
  $('aHost').innerHTML=st.hosters.map(function(h){return '<option>'+esc(h)+'</option>'}).join('');$('dlg').showModal()};
$('aSave').onclick=function(){var b=$('aSave');b.disabled=true;api('/api/account',{host:$('aHost').value,user:$('aUser').value,password:$('aPw').value}).then(function(j){b.disabled=false;if(!j.error){$('aUser').value='';$('aPw').value='';toast('Konto gespeichert.')}})};
$('sQuit').onclick=function(){busy=false;api('/api/quit').then(function(){document.body.innerHTML='<div class="empty">Ladewerk wurde beendet. Dieses Fenster kann geschlossen werden.</div>';window.close()})};
window.addEventListener('beforeunload',function(e){if(busy){e.preventDefault();e.returnValue=''}});
$('sCancel').onclick=function(){$('dlg').close()};
$('sSave').onclick=function(){api('/api/settings',{dir:$('sDir').value,maxParallel:$('sPar').value,chunks:$('sChk').value,speedLimitKB:$('sLim').value,retries:$('sRet').value,clipboard:$('sClip').checked,clicknload:$('sCnl').checked,extract:$('sExt').checked,deleteArchives:$('sDel').checked,passwords:$('sPw').value}).then(function(j){if(!j.error){$('dlg').close();toast('Gespeichert.')}})};
refresh();setInterval(refresh,1000);
})();
</script></body></html>
