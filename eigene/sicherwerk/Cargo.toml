[package]
name = "sicherwerk"
version = "0.2.2"
edition = "2021"
description = "Ordner regelmässig sichern – Teil der Werkbank"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Nur für die Ortszeit (Versionsnamen, Protokoll, ZIP-Zeitstempel).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[lints.rust]
# `ohne_serde` gilt nur für die Einzeltests mit rustc (siehe README).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ohne_serde)'] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
