name: Speicherwerk-Test

# «cargo test» für Speicherwerk (eigene/speicherwerk) unter Linux und Windows. Dazu gehört ein
# Ende-zu-Ende-Test: Ordnerbaum mit doppelten Dateien → suchen → Kopien in den echten Papierkorb,
# Originale, harte Links und Dateien mit anderem Inhalt bleiben. Veröffentlicht nichts.

on:
  push:
    paths: ["eigene/speicherwerk/**", ".github/workflows/speicherwerk-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    name: Test (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: linux
            runner: ubuntu-22.04
          - kind: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: eigene/speicherwerk
    steps:
      - uses: actions/checkout@v4
      - name: Linux-Abhängigkeiten
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eigene/speicherwerk
          key: test-${{ matrix.kind }}
      - name: Testen
        run: |
          set -o pipefail
          cargo test -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Fehler melden
        if: failure()
        run: |
          log="$RUNNER_TEMP/test.log"
          [ -f "$log" ] || exit 0
          text=$( (grep -E -A1 '^error(\[E[0-9]+\])?:' "$log" | grep -E '^error|-->' | grep -v 'could not compile' | head -40; echo "----"; grep -E -A6 "panicked at|^test .* FAILED|^failures:" "$log" | head -80) | cut -c1-240)
          text="${text//'%'/'%25'}"; text="${text//$'\r'/}"; text="${text//$'\n'/'%0A'}"
          echo "::error title=speicherwerk test ${{ matrix.kind }}::$text"
      - name: Warnungen melden
        if: always()
        run: |
          log="$RUNNER_TEMP/test.log"
          [ -f "$log" ] || exit 0
          text=$(grep -E -A1 '^warning' "$log" | grep -E '^warning|-->' | grep -v 'generated [0-9]* warning' | paste - - | cut -c1-200 | head -40)
          [ -n "$text" ] || exit 0
          text="${text//'%'/'%25'}"; text="${text//$'\r'/}"; text="${text//$'\n'/'%0A'}"
          echo "::warning title=speicherwerk warnings ${{ matrix.kind }}::$text"
      - name: Ergebnis
        if: always()
        run: |
          log="$RUNNER_TEMP/test.log"
          [ -f "$log" ] || exit 0
          text=$(grep -E '^test result:|^test .*(ok|FAILED|ignored)$|Papierkorb|Gruppen' "$log" | cut -c1-200 | head -60)
          text="${text//'%'/'%25'}"; text="${text//$'\r'/}"; text="${text//$'\n'/'%0A'}"
          echo "::notice title=speicherwerk tests ${{ matrix.kind }}::$text"
