name: Launcher-Release

# Baut den Werkbank-Launcher für Windows und Linux.
# Veröffentlichen: Reiter «Actions» → «Launcher-Release» → «Run workflow» und eine
# Versionsnummer angeben (z. B. 0.1.0). Ohne Nummer wird nur gebaut.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer für die Veröffentlichung, z. B. 0.1.0 (leer: nur bauen)"
        type: string
        default: ""
  # Probelauf: baut nur; mit «[probe launcher]» in der Commit-Meldung entsteht eine Vorabversion.
  push:
    branches: [probe]
    paths: ["launcher/**", ".github/workflows/launcher-release.yml"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: Launcher (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, runner: windows-latest, file: werkbank.exe, asset: werkbank-windows-x64.zip }
          - { name: Linux, runner: ubuntu-22.04, file: werkbank, asset: werkbank-linux-x86_64.tar.gz }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version festlegen
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          version="$IN_VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git log -1 --format=%s | grep -q '\[probe launcher\]'; then
            version="0.0.0-probe"
          fi
          if [ -n "$version" ]; then
            echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$' || { echo "::error::Keine gültige Versionsnummer: $version"; exit 1; }
            sed -i.bak "0,/^version = \".*\"/s//version = \"$version\"/" launcher/Cargo.toml && rm launcher/Cargo.toml.bak
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Bauen
        working-directory: launcher
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Fehler melden
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          text=$( (grep -A16 -E '^error' "$log" || tail -40 "$log") | head -150 | cut -c1-240)
          text="${text//'%'/'%25'}"; text="${text//$'\r'/}"; text="${text//$'\n'/'%0A'}"
          echo "::error title=Launcher ${{ matrix.name }}::$text"
      - name: Packen
        run: |
          mkdir -p out/werkbank
          cp "launcher/target/release/${{ matrix.file }}" README.md LICENSE out/werkbank/
          cd out
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -bso0 "${{ matrix.asset }}" werkbank; else tar czf "${{ matrix.asset }}" werkbank; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Veröffentlichen
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd out && sha256sum * > SHA256SUMS.txt
          TAG="werkbank-v$VERSION"
          # Versionen mit Zusatz (z. B. 0.1.0-test) gelten als Vorabversion.
          case "$VERSION" in *-*) kind=--prerelease ;; *) kind=--latest ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $kind \
              --title "Werkbank $VERSION" --notes "Werkbank-Launcher $VERSION für Windows und Linux."
          fi
