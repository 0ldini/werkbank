name: Offline-Setup

# Packt Launcher und alle veröffentlichten Programme (Windows + Browser) in ein Setup-Programm
# für Windows und veröffentlicht es als Release setup-v<Datum>.
# Start: Reiter «Actions» → «Offline-Setup» → «Run workflow».

# Danach wird das Setup auch auf den Server geladen (jarns.ch/software/setup/werkbank-setup.exe),
# sofern die FTP-Zugangsdaten hinterlegt sind (siehe Server-Upload). «Auf ansage» = nur wenn du
# diesen Ablauf von Hand startest.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Setup danach auf den Server laden"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  setup:
    name: Setup bauen
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Neueste Releases einsammeln
        run: |
          set -euo pipefail
          mkdir -p stage/bundle
          python3 setup/collect.py "$GITHUB_REPOSITORY" > tags.txt
          cat tags.txt
          LTAG=$(awk '$1=="werkbank"{print $2}' tags.txt)
          gh release download "$LTAG" --repo "$GITHUB_REPOSITORY" --pattern 'werkbank-windows-x64.zip' --dir stage
          (cd stage && 7z x -bso0 -y werkbank-windows-x64.zip && mv werkbank/werkbank.exe . && rm -rf werkbank werkbank-windows-x64.zip)
          cp README.md LICENSE stage/
          cp launcher/icons/werkbank.ico stage/werkbank.ico
          awk '$1!="werkbank"{print $2}' tags.txt | while read -r TAG; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*windows-x64-portable.zip' --pattern '*-web-*.zip' --dir stage/bundle
          done
          ls -l stage/bundle

      - name: Setup-Skript erzeugen
        run: |
          VERSION=$(date -u +%Y.%m.%d)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 setup/make_iss.py "$VERSION" "$PWD/stage" werkbank.iss

      - name: Inno Setup ausführen
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" werkbank.iss
          Get-ChildItem out

      - name: Veröffentlichen
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          TAG="setup-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Werkbank Offline-Setup $VERSION" \
              --notes "Setup-Programm für Windows mit allen Programmen. Beim Installieren wählbar: welche Programme, und ob vorher nach neueren Versionen gesucht wird."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: werkbank-setup
          path: out/werkbank-setup-*.exe
          if-no-files-found: error

  server:
    name: Auf den Server laden
    needs: setup
    if: inputs.upload
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ vars.FTP_DIR }}
      FTP_SSL_FORCE: ${{ vars.FTP_SSL_FORCE }}
      FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: werkbank-setup
          path: dl
      - name: Hochladen
        run: |
          set -euo pipefail
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::FTP-Zugangsdaten fehlen (Secrets FTP_HOST, FTP_USER, FTP_PASSWORD); kein Upload."
            exit 0
          fi
          [ -n "${FTP_DIR:-}" ] || unset FTP_DIR
          [ -n "${FTP_SSL_FORCE:-}" ] || unset FTP_SSL_FORCE
          [ -n "${FTP_VERIFY_CERT:-}" ] || unset FTP_VERIFY_CERT
          sudo apt-get update && sudo apt-get install -y --no-install-recommends lftp
          exe=$(ls dl/werkbank-setup-*.exe | head -n 1)
          ver=$(basename "$exe" .exe); ver=${ver#werkbank-setup-}
          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          printf '{"version":"%s","file":"werkbank-setup.exe","sha256":"%s"}\n' "$ver" "$sha" > latest.json
          bash setup/ftp-push.sh put "$exe" setup werkbank-setup.exe
          bash setup/ftp-push.sh put latest.json setup
