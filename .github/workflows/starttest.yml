name: Starttest

# Startet die veröffentlichten Programme (wie der Launcher, mit WERKBANK_LANG=de) auf Linux,
# Windows und im Browser, prüft, ob sie nach dem Start noch laufen, und macht ein Bildschirmfoto.
# Auf den Fotos wird nachgezählt, ob deutsche oder englische Menüwörter zu sehen sind.
# Lädt nur herunter, veröffentlicht nichts.
on:
  push:
    branches: [starttest]
  workflow_dispatch:
    inputs:
      apps:
        description: "Programme (leer: alle), z. B. «pdfcraft deckcraft»"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: starttest
  cancel-in-progress: true

jobs:
  plan:
    name: Planen
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.p.outputs.items }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          touch .github/starttest-quelle.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.draft|not) | {tag: .tag_name, assets: [.assets[].name]}' > rel.jsonl
          python3 - <<'EOF'
          import json, os, re, tomllib
          apps = tomllib.load(open("launcher/apps.toml", "rb")).get("app", []) + [{"id": "werkbank", "name": "Launcher"}]
          quelle = dict(l.split()[:2] for l in open(".github/starttest-quelle.txt") if len(l.split()) >= 2 and not l.startswith("#"))
          want = os.environ.get("APPS", "").split()
          arten = []
          for l in open(".github/starttest-quelle.txt"):
              if l.startswith("nur:"): want = l[4:].split()
              if l.startswith("arten:"): arten = l[6:].split()
          rels = [json.loads(l) for l in open("rel.jsonl")]
          def ver(t):
              return tuple(int(x) for x in re.findall(r"\d+", t.split("-v", 1)[1]))
          items = []
          for a in apps:
              i = a["id"]
              if want and i not in want:
                  continue
              if i in quelle:
                  run = quelle[i]
                  kinds = ("linux", "windows") if i == "werkbank" else ("linux", "windows", "web") if a.get("web") or a.get("web_only") or i.endswith("craft") or i in ("codewerk", "mailwerk", "organiwerk") else ("linux", "windows")
                  kinds = [k for k in kinds if not a.get("systeme") or {"linux": "linux", "windows": "windows", "web": "web"}[k] in a["systeme"] or k == "web"]
                  for kind in kinds:
                      if i == "werkbank":
                          art = {"linux": "werkbank-linux-x86_64.tar.gz", "windows": "werkbank-windows-x64.zip"}[kind]
                      elif i.endswith("craft"):
                          art = f"werk-{i}-{kind}"
                      else:
                          art = f"eigene-{i}-{kind}"
                      items.append({"app": i, "name": a.get("name", i), "tag": "", "run": run, "kind": kind, "asset": art})
                  continue
              mine = [r for r in rels if r["tag"].startswith(i + "-v") and "probe" not in r["tag"]]
              if not mine:
                  continue
              r = max(mine, key=lambda r: ver(r["tag"]))
              for kind, pat in (("linux", r"-linux-x86_64\.tar\.gz$"), ("windows", r"-windows-x64-portable\.zip$|^werkbank-windows-x64\.zip$"), ("web", r"-web-.*\.zip$")):
                  hit = [n for n in r["assets"] if re.search(pat, n)]
                  if hit:
                      items.append({"app": i, "name": a.get("name", i), "tag": r["tag"], "run": "", "kind": kind, "asset": hit[0]})
          if arten:
              items = [x for x in items if x["kind"] in arten]
          print(json.dumps(items, indent=1))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("items=" + json.dumps(items) + "\n")
          EOF

  linux:
    name: ${{ matrix.item.app }} (${{ matrix.item.kind }})
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        item: ${{ fromJson(needs.plan.outputs.items) }}
    runs-on: ${{ matrix.item.kind == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      APP: ${{ matrix.item.app }}
      KIND: ${{ matrix.item.kind }}
      TAG: ${{ matrix.item.tag }}
      ASSET: ${{ matrix.item.asset }}
      RUN: ${{ matrix.item.run }}
      WERKBANK_LANG: de
      WERKBANK_THEME: light
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Herunterladen
        run: |
          set -euo pipefail
          mkdir -p dl out app
          if [ -n "$RUN" ]; then
            gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "$ASSET" -D dl
          else
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ASSET" -D dl
          fi
          ls -l dl
          for f in dl/*; do
            case "$f" in
              *.tar.gz) tar xzf "$f" -C app ;;
              *.zip) (cd app && unzip -q "../$f") ;;
            esac
          done
          find app -maxdepth 3 | head -40

      - name: Linux vorbereiten
        if: matrix.item.kind == 'linux'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          EXTRA=""
          case "$APP" in abspielwerk|wandelwerk|diawerk|mediathekwerk|aufnahmewerk) EXTRA="libvlc5 vlc-plugin-base ffmpeg" ;; esac
          for i in 1 2 3; do
            timeout 180 sudo -E apt-get update -qq -o Acquire::Retries=3 && \
            timeout 300 sudo -E apt-get install -y -qq --no-install-recommends -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
              xvfb x11-utils imagemagick libgl1-mesa-dri libegl1 libgles2 mesa-vulkan-drivers libvulkan1 \
              libgtk-3-0t64 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libasound2t64 $EXTRA </dev/null >/dev/null && break
            echo "apt hängt, neuer Versuch"; sleep 10
          done

      - name: Starten (Linux)
        if: matrix.item.kind == 'linux'
        run: |
          set -uo pipefail
          EXE=$(find app -type f -perm -u+x \( -name "$APP" -o -name "$APP-bin" \) | head -1)
          [ -n "$EXE" ] || EXE=$(find app -type f -perm -u+x ! -name "*.so*" ! -name "*.sh" ! -name "*-cli" | head -1)
          echo "Programm: $EXE"
          Xvfb :99 -screen 0 1600x1000x24 >/dev/null 2>&1 &
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
          sleep 2
          (cd "$(dirname "$EXE")" && exec "./$(basename "$EXE")") > out/stdout.txt 2> out/stderr.txt &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then echo läuft > out/status.txt; else wait $PID; echo "beendet (Code $?)" > out/status.txt; fi
          timeout 60 import -window root out/bild.png || true
          kill $PID 2>/dev/null || true
          cat out/status.txt; tail -20 out/stderr.txt

      - name: Starten (Windows)
        if: matrix.item.kind == 'windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem app -Recurse -Filter "$env:APP.exe" | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem app -Recurse -Filter *.exe | Where-Object { $_.Name -notmatch 'cli|unins|crash' } | Select-Object -First 1 }
          "Programm: $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru -RedirectStandardError out/stderr.txt -RedirectStandardOutput out/stdout.txt
          Start-Sleep 25
          if ($p.HasExited) { "beendet (Code $($p.ExitCode))" | Out-File out/status.txt } else { "läuft" | Out-File out/status.txt }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/out/bild.png")
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content out/status.txt

      - name: Starten (Browser)
        if: matrix.item.kind == 'web'
        run: |
          set -uo pipefail
          IDX=$(find app -name index.html | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          ROOT=$(dirname "$IDX")
          echo "Seite: $IDX"
          (cd "$ROOT" && python3 -m http.server 8765 >/dev/null 2>&1 &)
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm i -s playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > t.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({ args: ['--use-gl=swiftshader', '--enable-unsafe-swiftshader'] });
            const p = await b.newPage({ locale: 'de-CH', viewport: { width: 1600, height: 1000 } });
            const errs = [];
            p.on('pageerror', e => errs.push('pageerror: ' + e.message));
            p.on('console', m => { if (m.type() === 'error') errs.push('console: ' + m.text()); });
            await p.goto('http://localhost:8765/?lang=de&theme=light', { waitUntil: 'load', timeout: 60000 });
            await p.waitForTimeout(25000);
            await p.screenshot({ path: process.argv[2] });
            const crashed = errs.some(e => e.startsWith('pageerror') && /panic|unreachable|RuntimeError/i.test(e));
            // Zweites Öffnen: kommt die Programmdatei aus dem Zwischenspeicher (Service Worker)?
            let speicher = 'kein Zwischenspeicher';
            try {
              await p.evaluate(async () => { if (navigator.serviceWorker) await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(r, 15000))]); });
              const ausSpeicher = [];
              p.on('response', r => { if (/\.wasm$/.test(new URL(r.url()).pathname)) ausSpeicher.push(r.fromServiceWorker()); });
              const t0 = Date.now();
              await p.reload({ waitUntil: 'load', timeout: 60000 });
              await p.waitForTimeout(5000);
              const ctl = await p.evaluate(() => !!(navigator.serviceWorker && navigator.serviceWorker.controller));
              if (ctl) speicher = `Zwischenspeicher ${ausSpeicher.includes(true) ? 'ja' : 'aktiv, wasm nicht daraus'} (${((Date.now() - t0) / 1000).toFixed(1)} s)`;
            } catch (e) { speicher = 'Zwischenspeicher-Fehler: ' + e.message; }
            require('fs').writeFileSync(process.argv[3], errs.join('\n'));
            require('fs').writeFileSync(process.argv[4], (crashed ? 'abgestürzt' : 'läuft') + ', ' + speicher);
            await b.close();
          })().catch(e => { require('fs').writeFileSync(process.argv[4], 'Fehler: ' + e.message); process.exit(0); });
          EOF
          node t.js "$GITHUB_WORKSPACE/out/bild.png" "$GITHUB_WORKSPACE/out/stderr.txt" "$GITHUB_WORKSPACE/out/status.txt"
          cat "$GITHUB_WORKSPACE/out/status.txt"; echo; head -c 2000 "$GITHUB_WORKSPACE/out/stderr.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: start-${{ matrix.item.app }}-${{ matrix.item.kind }}
          path: out/*
          if-no-files-found: warn

  auswertung:
    name: Auswertung
    needs: [plan, linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: start-*
          path: res
      - name: Zählen
        run: |
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu >/dev/null
          python3 - <<'EOF' > bericht.txt
          import pathlib, re, subprocess
          DE = {"Datei","Bearbeiten","Ansicht","Hilfe","Einfügen","Einstellungen","Öffnen","Speichern","Neu","Werkzeuge","Format","Fenster","Bild","Ebene","Rückgängig","Abbrechen","Start","Seite","Suchen","Schliessen","Folie","Tabelle","Ton","Spur","Wiedergabe","Export","Exportieren","Projekt","Auswahl","Effekte","Zoom","Farbe"}
          EN = {"File","Edit","View","Help","Insert","Settings","Preferences","Open","Save","New","Tools","Window","Image","Layer","Undo","Cancel","Home","Page","Search","Find","Close","Slide","Table","Track","Playback","Project","Selection","Effects","Recent","Untitled","Welcome"}
          rows = []
          for d in sorted(pathlib.Path("res").iterdir()):
              name = d.name[len("start-"):]
              st = (d / "status.txt").read_text(errors="replace").strip() if (d / "status.txt").exists() else "kein Ergebnis"
              de = en = "-"
              if (d / "bild.png").exists():
                  txt = subprocess.run(["tesseract", str(d / "bild.png"), "-", "-l", "deu+eng"], capture_output=True, text=True).stdout
                  words = set(re.findall(r"[A-Za-zÄÖÜäöü]+", txt))
                  de, en = len(words & DE), len(words & EN)
                  (d / "text.txt").write_text(txt)
              err = ""
              if "läuft" not in st and (d / "stderr.txt").exists():
                  log = (d / "stderr.txt").read_text(errors="replace").splitlines()
                  wichtig = [l for l in log if re.search(r"error|panic|warn|fehler", l, re.I)][-4:]
                  err = " | " + " / ".join(x.strip()[:160] for x in (wichtig or log[-3:]))
              rows.append(f"{name}: {st}, deutsch {de} / englisch {en}{err}")
          print("\n".join(rows))
          EOF
          cat bericht.txt
          split -l 20 bericht.txt teil.
          for f in teil.*; do t=$(cat "$f"); t="${t//'%'/'%25'}"; t="${t//$'\n'/'%0A'}"; echo "::notice title=Starttest ${f#teil.}::$t"; done
      - uses: actions/upload-artifact@v4
        with:
          name: starttest-bericht
          path: |
            bericht.txt
            res/**
